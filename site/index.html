<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex, follow">
  <meta http-equiv="refresh" content="2; url=https://usegarret.com/">
  <link rel="canonical" href="https://usegarret.com/">
  <title>garret has a new home</title>
  <link rel="icon" href="brand/garret-appicon-light.png">
  <link rel="stylesheet" href="style.css">
  <script>
    const destination = new URL('https://usegarret.com/');
    const anchors = {
      '#get-garret': '/downloads/', '#get-heading': '/downloads/',
      '#tools': '/#studio', '#tools-heading': '/#studio',
      '#review-heading': '/#revision', '#publishing-heading': '/#publishing',
      '#ownership-heading': '/guide/#backup', '#mobile-heading': '/downloads/#android'
    };
    const target = new URL(anchors[location.hash] || '/', destination);
    target.search = location.search;
    location.replace(target.href);
  </script>
</head>
<body>
  <header class="site-header wrap">
    <a class="brand" href="https://usegarret.com/" aria-label="garret home">
      <picture>
        <source media="(prefers-color-scheme: dark)" srcset="brand/garret-wordmark-paper.png">
        <img src="brand/garret-wordmark-ink.png" alt="garret." width="1024" height="473">
      </picture>
    </a>
  </header>
  <main class="hero wrap" id="main">
    <h1>garret has a new home.</h1>
    <p class="intro">The writing studio, downloads, and getting-started guide are now at usegarret.com.</p>
    <div class="actions">
      <a class="button" href="https://usegarret.com/">Visit usegarret.com</a>
      <a href="https://usegarret.com/downloads/">Download garret</a>
      <a href="https://usegarret.com/#studio">Explore the tools</a>
      <a href="https://usegarret.com/guide/">Getting started</a>
    </div>
  </main>
  <footer class="wrap site-footer">
    <a href="https://github.com/iuliandita/garret">Source code and releases</a>
  </footer>
</body>
</html>
