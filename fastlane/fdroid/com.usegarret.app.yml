AutoName: garret
Summary: Write novels offline
Description: |-
  An offline writing companion with a local library, scene editing and
  encrypted book transfer. No account is needed. English and German,
  with light and dark themes. The Android app has fewer features than
  the desktop writing studio.

  The code is largely written with AI coding agents, with human review
  and testing. This disclosure also appears in the fastlane descriptions.

# No invented AI AntiFeatures identifier: maintainers decide its classification.
RepoType: git
Repo: https://github.com/iuliandita/garret.git
Binaries: https://github.com/iuliandita/garret/releases/download/v%v/garret-%v-android.apk
AllowedAPKSigningKeys:
  - bddd339d8832a6378dbd0471e41a3d2148f4411fa8b004c6b5524c93f6684a92

Builds:
  - versionName: 0.0.4
    versionCode: 4
    commit: v0.0.4
    sudo:
      - apt-get update
      - apt-get install -y gcc libc6-dev openjdk-21-jdk-headless rustup curl unzip xz-utils python3 disorderfs
      - curl -fL https://nodejs.org/dist/v26.11.1/node-v26.11.1-linux-x64.tar.xz -o /tmp/node.tar.xz
      - echo '3883bfc73f9a680ca4eab04b196068aaaab1373ffa77d8fc1a4408222495b651  /tmp/node.tar.xz' | sha256sum -c -
      - tar -xJf /tmp/node.tar.xz --strip-components=1 -C /usr/local
      - curl -fL https://github.com/oven-sh/bun/releases/download/bun-v1.4.2/bun-linux-x64.zip -o /tmp/bun.zip
      - echo '36368faef7527875d5ffa52e53cd48021741f2a83eb6208a8dd64068d422a913  /tmp/bun.zip' | sha256sum -c -
      - unzip -q /tmp/bun.zip -d /tmp
      - install /tmp/bun-linux-x64/bun /usr/local/bin/bun
      - npm install --global --ignore-scripts @tauri-apps/cli@2.11.5
    init:
      # Tauri embeds CSP script hashes in filesystem traversal order.
      - cd ..
      - mv com.usegarret.app com.usegarret.app.build
      - mkdir com.usegarret.app
      - disorderfs --sort-dirents=yes --reverse-dirents=no com.usegarret.app.build com.usegarret.app
      - cd com.usegarret.app
      - rustup default 1.98.1
      - rustup target add aarch64-linux-android x86_64-linux-android
      # Tauri drives Cargo directly; cargo-ndk is not invoked or installed.
    output: app/shell-tauri/src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk
    build:
      - export PATH=/usr/local/bin:$HOME/.cargo/bin:$PATH
      - export ANDROID_HOME=$$SDK$$
      - export NDK_HOME=$$NDK$$
      - export JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64
      - export CARGO_BUILD_JOBS=8
      - export JAVA_TOOL_OPTIONS=-XX:ActiveProcessorCount=8
      - bash scripts/android/build-release
    ndk: 30.0.16248370

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9]+\.[0-9]+\.[0-9]+$
UpdateCheckData: app/shell-tauri/src-tauri/tauri.android.conf.json|"versionCode":\s*(\d+)|app/shell-tauri/src-tauri/tauri.conf.json|"version":\s*"([0-9.]+)"
