name: Windows PDF
on:
  pull_request:
    branches: [develop]
    paths:
      - 'app/shell-tauri/src-tauri/src/main.rs'
      - 'app/shell-tauri/src-tauri/src/printer_windows.rs'
      - 'app/shell-tauri/src-tauri/src/printer.rs'
      - 'app/shell-tauri/src-tauri/src/pdf*.rs'
      - 'app/shell-tauri/src-tauri/src/commands/export.rs'
      - 'app/shell-tauri/src-tauri/Cargo.toml'
      - 'app/shell-tauri/src-tauri/Cargo.lock'
      - 'app/fixtures/sample/**'
      - '.github/workflows/windows-pdf.yml'
      - 'scripts/windows/pdf-smoke.ps1'
  push:
    branches: [develop]
    paths:
      - 'app/shell-tauri/src-tauri/src/main.rs'
      - 'app/shell-tauri/src-tauri/src/printer_windows.rs'
      - 'app/shell-tauri/src-tauri/src/printer.rs'
      - 'app/shell-tauri/src-tauri/src/pdf*.rs'
      - 'app/shell-tauri/src-tauri/src/commands/export.rs'
      - 'app/shell-tauri/src-tauri/Cargo.toml'
      - 'app/shell-tauri/src-tauri/Cargo.lock'
      - 'app/fixtures/sample/**'
      - '.github/workflows/windows-pdf.yml'
      - 'scripts/windows/pdf-smoke.ps1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-pdf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-pdf:
    name: Native PDF (advisory)
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 8
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: '-C target-feature=+crt-static'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - name: Build the interface for the host
        shell: pwsh
        run: |
          Push-Location app/ui
          try {
            bun run build
            if ($LASTEXITCODE -ne 0) { throw 'Interface build failed' }
          } finally { Pop-Location }
          Copy-Item app/ui/dist app/shell-tauri/dist -Recurse
      - name: Install pinned Rust
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: app/shell-tauri/src-tauri
          key: alpha-windows-1.98.1
          cache-on-failure: true
      - name: Build the native host
        working-directory: app/shell-tauri/src-tauri
        run: cargo build --locked --release --features pdf-smoke --target x86_64-pc-windows-msvc -j 8
      - name: Export the sample through WebView2
        timeout-minutes: 6
        shell: pwsh
        run: ./scripts/windows/pdf-smoke.ps1
      - name: Upload PDF and diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-pdf
          path: |
            ${{ runner.temp }}/pdf-smoke/proof.pdf
            ${{ runner.temp }}/pdf-smoke/*.json
            ${{ runner.temp }}/pdf-smoke/*.jsonl
            ${{ runner.temp }}/pdf-smoke/*.log
          if-no-files-found: warn
          retention-days: 14
