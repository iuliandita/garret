name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  interface:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Documentation checks
        env:
          DOCS_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          export HOME="$(mktemp -d)" XDG_DATA_HOME="$(mktemp -d)" TMPDIR="$(mktemp -d)"
          python3 scripts/test-release.py
          python3 scripts/test-docs.py
          python3 scripts/test-docs-facts.py
          python3 scripts/test-android-smoke.py
          if [ -n "$DOCS_BASE" ]; then
            sh scripts/check-docs --base "$DOCS_BASE"
          else
            sh scripts/check-docs
          fi
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit -p app/tsconfig.json
      - run: HOME="$(mktemp -d)" XDG_DATA_HOME="$(mktemp -d)" TMPDIR="$(mktemp -d)" bun test ./app/ui
      - run: HOME="$(mktemp -d)" XDG_DATA_HOME="$(mktemp -d)" TMPDIR="$(mktemp -d)" bun test ./app/harness
      - run: HOME="$(mktemp -d)" XDG_DATA_HOME="$(mktemp -d)" TMPDIR="$(mktemp -d)" bun test ./app/mobile-ui/test
      - run: bun run build
        working-directory: app/ui

  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install WebKitGTK build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev librsvg2-dev poppler-utils
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      # The host embeds the built interface from app/shell-tauri/dist.
      - name: Build the interface for the host
        run: |
          (cd app/ui && bun run build)
          mkdir -p app/shell-tauri/dist
          cp -r app/ui/dist/. app/shell-tauri/dist/
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: app/shell-tauri/src-tauri
      - name: Host tests
        working-directory: app/shell-tauri/src-tauri
        run: |
          export CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}" RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}"
          export HOME="$(mktemp -d)" XDG_DATA_HOME="$(mktemp -d)" TMPDIR="$(mktemp -d)"
          cargo test --locked --bin garret -- --exact
      # The proof paginator runs in a web view and needs a display, so it is
      # ignored by default. Run the paginator fixtures under a virtual one.
      - name: Install a virtual display
        run: sudo apt-get install -y --no-install-recommends xvfb
      - name: Proof paginator
        timeout-minutes: 8
        working-directory: app/shell-tauri/src-tauri
        env:
          GDK_BACKEND: x11
          WEBKIT_DISABLE_COMPOSITING_MODE: "1"
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
          NO_AT_BRIDGE: "1"
        run: |
          export CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}" RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}"
          export HOME="$(mktemp -d)" XDG_DATA_HOME="$(mktemp -d)" TMPDIR="$(mktemp -d)"
          # The outer bound also covers compilation and startup (#324).
          if env -u WAYLAND_DISPLAY timeout --verbose --signal=TERM --kill-after=30s 420s \
            xvfb-run -a sh -c '
              cargo test --locked --bin garret -- --ignored --exact --test-threads=1 \
                printer::tests::rich_paragraphs_keep_text_and_marks_and_oversized_headings_refuse &&
              cargo test --locked --bin garret -- --ignored --exact --test-threads=1 \
                printer::tests::notes_figures_and_plates_decode_before_layout_and_print_intact &&
              cargo test --locked --bin garret -- --ignored --exact --test-threads=1 \
                printer::tests::typed_dashes_stay_on_one_line_and_page'; then
            exit 0
          else
            status=$?
            if [ "$status" -eq 124 ] || [ "$status" -eq 137 ]; then
              echo '::error::Proof paginator exceeded 420 seconds (30-second kill grace); see #324.'
              ps -eo pid,ppid,stat,etime,wchan:32,comm
            fi
            exit "$status"
          fi
